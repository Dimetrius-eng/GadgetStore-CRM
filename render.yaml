services:
  - type: web
    name: gadget-store-crm
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ALLOWED_ORIGINS
        value: https://dimetrius-eng.tech,https://gadget-store-crm.tech,https://www.gadget-store-crm.tech,https://gadget-store-crm-jj8m.onrender.com
      - key: ORIGIN_VERIFY_SECRET
        sync: false
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: MANAGER_USERNAME
        value: manager
      - key: MANAGER_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: product-images
