{{define "content"}}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold m-0 text-slate-800">{{if .Product.ID}}Редагування гаджета{{else}}Додавання нового гаджета{{end}}</h2>
        <p class="text-muted m-0 small">Заповніть параметри товару для відображення в каталозі</p>
    </div>
    <a href="/products" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Назад до каталогу</a>
</div>

<div class="card card-custom p-4 max-w-800 mx-auto">
    <form action="{{if .Product.ID}}/products/edit?id={{.Product.ID}}{{else}}/products/add{{end}}" method="POST" enctype="multipart/form-data">
        <div class="mb-4">
            <label class="form-label fw-semibold">Фото товару</label>
            <input type="file" name="image" id="productImage" class="form-control" accept="image/jpeg,image/png,image/webp,image/gif">
            <div class="form-text">JPG, PNG, WEBP або GIF · до 5 МБ</div>
            <img id="imagePreview" src="{{.Product.ImagePath}}" alt="Попередній перегляд товару" class="mt-3 rounded-3 border {{if not .Product.ImagePath}}d-none{{end}}" style="width:180px;height:150px;object-fit:cover">
        </div>
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label fw-semibold">Назва гаджета</label>
                <input type="text" name="title" class="form-control" value="{{.Product.Title}}" placeholder="Наприклад: iPhone 15 Pro Max 256GB" required>
            </div>

            <div class="col-md-4">
                <label class="form-label fw-semibold">Артикул (SKU)</label>
                <input type="text" name="sku" class="form-control" value="{{.Product.SKU}}" placeholder="IPH-15PM-256" required>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold">Категорія</label>
                <select name="category_id" class="form-select">
                    <option value="0">-- Без категорії --</option>
                    {{$selectedCat := .Product.CategoryID}}
                    {{range .Categories}}
                    <option value="{{.ID}}" {{if eq .ID $selectedCat}}selected{{end}}>{{.Name}}</option>
                    {{end}}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold">Бренд / Виробник</label>
                <select name="brand_id" class="form-select">
                    <option value="0">-- Без бренду --</option>
                    {{$selectedBrand := .Product.BrandID}}
                    {{range .Brands}}
                    <option value="{{.ID}}" {{if eq .ID $selectedBrand}}selected{{end}}>{{.Name}}</option>
                    {{end}}
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label fw-semibold">Закупівельна ціна (₴)</label>
                <input type="number" step="0.01" name="purchase_price" class="form-control" value="{{.Product.PurchasePrice}}" required>
            </div>

            <div class="col-md-4">
                <label class="form-label fw-semibold">Роздрібна ціна (₴)</label>
                <input type="number" step="0.01" name="selling_price" class="form-control" value="{{.Product.SellingPrice}}" required>
            </div>

            <div class="col-md-2">
                <label class="form-label fw-semibold">Кількість</label>
                <input type="number" name="quantity" class="form-control" value="{{.Product.Quantity}}" required>
            </div>

            <div class="col-md-2">
                <label class="form-label fw-semibold">Гарантія (міс)</label>
                <input type="number" name="warranty_months" class="form-control" value="{{.Product.WarrantyMonth}}" required>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <a href="/products" class="btn btn-light px-4">Скасувати</a>
            <button type="submit" class="btn btn-royal px-4"><i class="bi bi-check2-circle me-1"></i> Зберегти гаджет</button>
        </div>
    </form>
</div>
<script>
document.getElementById('productImage').addEventListener('change', function (event) {
  const file = event.target.files[0], preview = document.getElementById('imagePreview');
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { alert(document.documentElement.lang==='en'?'The image must be 5 MB or smaller':'Фото має бути не більшим за 5 МБ'); event.target.value = ''; return; }
  preview.src = URL.createObjectURL(file); preview.classList.remove('d-none');
});
</script>
{{end}}
