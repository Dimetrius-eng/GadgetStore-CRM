<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — GadgetStore CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .brand-icon-lg {
            background: linear-gradient(135deg, #2563eb 0%, #d97706 100%);
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            color: #fff;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body>

<button type="button" id="loginLanguage" class="btn btn-outline-light btn-sm position-absolute top-0 end-0 m-3">EN</button>

<div class="card login-card text-white p-4">
    <div class="text-center mb-4">
        <div class="brand-icon-lg mb-3"><i class="bi bi-cpu-fill"></i></div>
        <h3 class="fw-bold m-0">GadgetStore CRM</h3>
    </div>

    {{if .Error}}
    <div class="alert alert-danger py-2 mb-3 text-center small rounded-3">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>{{.Error}}
    </div>
    {{end}}

    <form action="/login" method="POST">
        <div class="mb-3">
            <label class="form-label text-light fw-bold small">Логін користувача</label>
            <div class="input-group">
                <span class="input-group-text bg-secondary bg-opacity-20 text-white border-secondary"><i class="bi bi-person-fill"></i></span>
                <input type="text" name="username" class="form-control bg-dark text-white border-secondary" placeholder="admin" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-light fw-bold small">Пароль</label>
            <div class="input-group">
                <span class="input-group-text bg-secondary bg-opacity-20 text-white border-secondary"><i class="bi bi-key-fill"></i></span>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="admin123" required>
            </div>
        </div>

        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm">
            <i class="bi bi-box-arrow-in-right me-1"></i> Увійти в систему
        </button>
    </form>
</div>

<script>
const loginEN={"Вхід — GadgetStore CRM":"Sign in — GadgetStore CRM","Логін користувача":"Username","Пароль":"Password","Увійти в систему":"Sign in","Невірний логін або пароль!":"Incorrect username or password."};
const originalLoginTitle=document.title;
function setLoginLanguage(lang){document.documentElement.lang=lang;localStorage.setItem('gadget-language',lang);document.title=lang==='en'?loginEN[originalLoginTitle]:originalLoginTitle;document.getElementById('loginLanguage').textContent=lang==='uk'?'EN':'УК';const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);while(walker.nextNode()){const n=walker.currentNode,k=n.nodeValue.trim();if(lang==='en'&&loginEN[k])n.nodeValue=n.nodeValue.replace(k,loginEN[k]);else if(lang==='uk'){const original=Object.keys(loginEN).find(x=>loginEN[x]===k);if(original)n.nodeValue=n.nodeValue.replace(k,original)}}document.querySelectorAll('[placeholder]').forEach(e=>{if(lang==='en'){if(!e.dataset.ukPlaceholder)e.dataset.ukPlaceholder=e.placeholder;if(e.placeholder==='admin')e.placeholder='username';if(e.placeholder==='admin123')e.placeholder='password'}else if(e.dataset.ukPlaceholder)e.placeholder=e.dataset.ukPlaceholder})}
if(localStorage.getItem('gadget-language')==='en')setLoginLanguage('en');document.getElementById('loginLanguage').addEventListener('click',()=>setLoginLanguage(document.documentElement.lang==='uk'?'en':'uk'));
</script>

</body>
</html>
